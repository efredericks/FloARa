<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Accelerometer Plant Placement Demo</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="./assets/style.css">
  <script src="./assets/js/p5.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #eaf6f6; }
    #placeBtn {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      padding: 18px 36px;
      font-size: 1.3rem;
      background: #ffffff;
      color: #263238;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 10;
      cursor: pointer;
    }
    #placeBtn:active { background: #388e3c; }
    .plant {
      fill: #4CAF50;
      stroke: #388e3c;
      stroke-width: 3px;
    }
  </style>
</head>
<body>
  <ul class="menu">
    <li><a class="menuItem" id="toggle_adding" href="#">toggle adding flowers</a></li>
    <li><a class="menuItem" id="toggle_anim" href="#">toggle animation</a></li>
    <li><a class="menuItem" id="toggle_glitch" href="#">toggle glitch shaders</a></li>
    <li><a class="menuItem" id="playback" href="#">start from beginning</a></li>
    <li><a class="menuItem" id="current" href="#">start from now</a></li>
    <li><a class="menuItem" id="save" href="#">save image</a></li>
    <li><a class="menuItem" id="close" href="#">close menu</a></li>
    <li>
      <select id="plantFilter" class="menuItem" onchange="filterPlants(this.value)">
        <option value="all">Show All Plants</option>
        <option value="manual">Show Manual Plants</option>
        <option value="propagated">Show Propagated Plants</option>
      </select>
    </li>
  </ul>
  <button class="hamburger">
    <i class="menuIcon material-icons">menu</i>
    <i class="closeIcon material-icons">close</i>
  </button>
  <div id="motionMsg" style="position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.95);z-index:100;font-size:1.3rem;color:#388e3c;">Tap anywhere to enable motion controls</div>
  <div style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;">
    <label style="font-size:1rem;color:#388e3c;">
      Plant:
      <select id="plantType">
        <option value="milkweed">Milkweed</option>
        <option value="nymphaea">Nymphaea</option>
      </select>
    </label>
    <label style="font-size:1rem;color:#388e3c;">
      Stage:
      <select id="plantStage">
        <option value="0">1</option>
        <option value="1">2</option>
        <option value="2">3</option>
        <option value="3">4</option>
        <option value="4">5</option>
      </select>
    </label>
  </div>
  <button id="placeBtn">Place Plant</button>
  <script src="assets/js/accelerometer-placement.js"></script>
  <script>
    // GUI for menu (copied from index.html)
    const menu = document.querySelector(".menu");
    const menuItems = document.querySelectorAll(".menuItem");
    const hamburger = document.querySelector(".hamburger");
    const closeIcon = document.querySelector(".closeIcon");
    const menuIcon = document.querySelector(".menuIcon");

    // used in p5 (for compatibility)
    window.animate_scene = true;
    window.shaders_on = false;
    window.adding_flowers = false;

    function toggleMenu(e) {
      if (menu.classList.contains("showMenu")) {
        menu.classList.remove("showMenu");
        closeIcon.style.display = "none";
        menuIcon.style.display = "block";
      } else {
        menu.classList.add("showMenu");
        closeIcon.style.display = "block";
        menuIcon.style.display = "none";
      }

      // toggle p5 vars
      if (e !== undefined) {
        if (e.id == 'toggle_anim') window.animate_scene = !window.animate_scene;
        else if (e.id == 'toggle_glitch') window.shaders_on = !window.shaders_on;
        else if (e.id == 'toggle_adding') window.adding_flowers = !window.adding_flowers;
        else if (e.id == 'save') saveImage && saveImage();
      }
    }

    hamburger.addEventListener("click", toggleMenu);

    menuItems.forEach(
      function (menuItem) {
        menuItem.addEventListener("click", (e) => {
          // Don't toggle menu if clicking on select element
          if (e.target.tagName !== 'SELECT') {
            toggleMenu(e.target);
          }
        });
      }
    )
  </script>
</body>
</html>
