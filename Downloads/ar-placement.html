<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FloARa AR Placement</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/@jeromeetienne/ar.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v6.1.1/dist/aframe-extras.loaders.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #feedback-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.2em;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 10;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            z-index: 10;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
  </head>
  <body>
    <button class="back-button" onclick="window.location.href='index.html'">Back to Garden</button>
    <div id="feedback-message">Loading AR...</div>

    <a-scene embedded arjs='detectionMode: mono; sourceType: webcam;' renderer='logarithmicDepthBuffer: true;'>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity light="type: directional; intensity: 0.8;" position="-1 1 1"></a-entity>
      <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
    </a-scene>

    <script type="module">
      // Firebase configuration (copy from index.html)
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDczt4Is3FPtDR-zqneuzHyU0sPfo-Sf7w",
        authDomain: "floara-388a1.firebaseapp.com",
        projectId: "floara-388a1",
        storageBucket: "floara-388a1.firebasestorage.app",
        messagingSenderId: "82081375122",
        appId: "1:82081375122:web:8772b4a4055de1c0b4174b",
        measurementId: "G-X3KHSFJP80"
      };

      try {
        console.log("Initializing Firebase...");
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        console.log("Firebase initialized successfully");

        window.addFlower = async function(flowerData) {
          try {
            const docRef = await addDoc(collection(db, "flowers"), flowerData);
            console.log("Flower added to Firestore with ID: ", docRef.id);
            return docRef.id;
          } catch (error) {
            console.error("Error adding flower:", error);
            return null;
          }
        };

      } catch (error) {
        console.error("Error initializing Firebase:", error);
      }

      const feedbackMessage = document.getElementById('feedback-message');

      // Function to get URL parameters
      function getUrlParams() {
          const params = {};
          const queryString = window.location.search.substring(1);
          const regex = /([^&=]+)=([^&]*)/g;
          let m;
          while (m = regex.exec(queryString)) {
              params[decodeURIComponent(m[1])] = decodeURIComponent(m[2]);
          }
          return params;
      }

      const params = getUrlParams();
      console.log("URL Parameters:", params);

      let flowerType = params['type'];
      let flowerColor = params['color'] || '#ffffff'; // Default to white if no color is provided
      let flowerQRId = params['qrId']; // Use qrId from URL if present

      // Use type or qrId to determine the flower model/details
      if (flowerType === undefined && flowerQRId !== undefined) {
          flowerType = flowerQRId; // Assume qrId is equivalent to type for now
      }

      if (flowerType === undefined) {
          feedbackMessage.textContent = 'Error: Flower type not specified in QR code.';
          console.error('Flower type not specified in URL parameters.');
      } else {
          feedbackMessage.textContent = `Tap to place ${flowerType === '0' ? 'Milkweed' : flowerType === '1' ? 'Nymphaea' : 'Unknown Plant'}`; // Basic message based on type

          const scene = document.querySelector('a-scene');
          scene.addEventListener('arjs-original-camera-init', function() {
              console.log('AR.js camera initialized.');
              feedbackMessage.textContent = 'Move your device to find a surface.';
          });

          scene.addEventListener('arjs-video-initialized', function() {
               console.log('AR.js video initialized.');
          });

          // Assuming a simple tap-to-place on detected surfaces
          scene.addEventListener('click', function(event) {
              if (!event.detail.intersection) {
                  feedbackMessage.textContent = 'Tap on a detected surface.';
                  return;
              }

              const hit = event.detail.intersection;
              console.log('Surface tapped at:', hit.point);

              // Create a basic 3D model (e.g., a colored box) at the hit point
              const flowerEntity = document.createElement('a-box'); // Placeholder model
              flowerEntity.setAttribute('position', `${hit.point.x} ${hit.point.y} ${hit.point.z}`);
              flowerEntity.setAttribute('color', flowerColor); // Set color from QR data
              flowerEntity.setAttribute('scale', '0.2 0.2 0.2'); // Adjust size as needed

              scene.appendChild(flowerEntity);

              feedbackMessage.textContent = 'Flower placed! Saving...';

              // Prepare data for saving to Firebase
              const flowerData = {
                  type: flowerType, // Use the type from QR
                  color: flowerColor, // Use the color from QR
                  // We'll need a way to store AR position if needed, but for now
                  // let's just save type and color and perhaps a flag indicating AR placement.
                  // For simplicity, let's reuse the structure and maybe add AR position later if required.
                  location: { x: hit.point.x, y: hit.point.y, z: hit.point.z }, // Storing AR position (may need conversion for 2D garden view)
                  timestamp: new Date().toISOString(),
                  propagationType: 'ar' // Indicate AR placement
              };

              window.addFlower(flowerData).then(id => {
                  if (id) {
                      feedbackMessage.textContent = 'Flower saved to garden!';
                      console.log('Flower data saved:', flowerData);
                      // Optionally redirect back to index.html after a delay
                      setTimeout(() => {
                          window.location.href = 'index.html';
                      }, 3000);
                  } else {
                      feedbackMessage.textContent = 'Error saving flower.';
                  }
              }).catch(error => {
                  console.error('Error saving flower via addFlower:', error);
                   feedbackMessage.textContent = 'Error saving flower.';
              });
          });

           // Update feedback message when a surface is detected (AR.js specific event)
            scene.addEventListener('arjs-anchor-found', function(event){
                feedbackMessage.textContent = 'Surface found! Tap to place flower.';
            });

             scene.addEventListener('arjs-anchor-lost', function(event){
                feedbackMessage.textContent = 'Looking for a surface...';
            });
      }


    </script>
  </body>
</html>
