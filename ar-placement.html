<body>
  <main>

  <script src="temp-data.js"></script>
  <!-- <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="./assets/js/qr-generator.js"></script> -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDczt4Is3FPtDR-zqneuzHyU0sPfo-Sf7w",
      authDomain: "floara-388a1.firebaseapp.com",
      projectId: "floara-388a1",
      storageBucket: "floara-388a1.firebasestorage.app",
      messagingSenderId: "82081375122",
      appId: "1:82081375122:web:8772b4a4055de1c0b4174b",
      measurementId: "G-X3KHSFJP80"
    };

    try {
      console.log("Initializing Firebase...");
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      console.log("Firebase initialized successfully");

      window.getFlowerData = async function () {
        try {
          console.log("Fetching flora data...");
          const snapshot = await getDocs(collection(db, "flowers"));
          const data = snapshot.docs.map(doc => ({
            ...doc.data(),
            id: doc.id
          }));
          console.log("Flora data fetched:", data);
          return data;
        } catch (error) {
          console.error("Error fetching flora:", error);
          return [];
        }
      };

      // Real-time Firestore listener for flowers collection
      window.subscribeToFlowers = function (callback) {
        const unsubscribe = onSnapshot(collection(db, "flowers"), (snapshot) => {
          const data = snapshot.docs.map(doc => ({
            ...doc.data(),
            id: doc.id
          }));
          callback(data);
        }, (error) => {
          console.error("Error in real-time flora listener:", error);
        });
        return unsubscribe; // Call this to stop listening
      };

      window.addFlower = async function (flowerData) {
        try {
          const docRef = await addDoc(collection(db, "flowers"), flowerData);
          return docRef.id;
        } catch (error) {
          console.error("Error adding flora:", error);
          return null;
        }
      };

      window.deleteFlower = async function (flowerId) {
        try {
          await deleteDoc(doc(db, "flowers", flowerId));
          return true;
        } catch (error) {
          console.error("Error deleting flora:", error);
          return false;
        }
      };
    } catch (error) {
      console.error("Error initializing Firebase:", error);
    }
  </script>
  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/ar-sketch.js"></script>
</body>

</html>
