<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FloARa AR Placement</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/@jeromeetienne/ar.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v6.1.1/dist/aframe-extras.loaders.min.js"></script>
    <link rel="stylesheet" href="ar-placement.css">
  </head>
  <body>
    <button class="back-button" onclick="window.location.href='index.html'">Back to Garden</button>
    <button class="mode-switch" onclick="toggleMode()">Switch to Map View</button>
    <div id="feedback-message">Loading AR...</div>

    <div id="map-view">
      <div id="map-container">
        <img id="map-image" src="131028_Fall_Campus-6934_Pano-2.jpg" alt="Fall Campus Map">
        <div class="map-controls">
          <button onclick="zoomIn()">+</button>
          <button onclick="zoomOut()">-</button>
          <button onclick="placeFlowerOnMap()">Place Flower</button>
        </div>
      </div>
    </div>

    <div id="ar-scene">
      <a-scene embedded arjs='detectionMode: mono; sourceType: webcam;' renderer='logarithmicDepthBuffer: true;'>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: directional; intensity: 0.8;" position="-1 1 1"></a-entity>
        <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
      </a-scene>
    </div>

    <script type="module">
      // Firebase configuration (copied from index.html)
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDczt4Is3FPtDR-zqneuzHyU0sPfo-Sf7w",
        authDomain: "floara-388a1.firebaseapp.com",
        projectId: "floara-388a1",
        storageBucket: "floara-388a1.firebasestorage.app",
        messagingSenderId: "82081375122",
        appId: "1:82081375122:web:8772b4a4055de1c0b4174b",
        measurementId: "G-X3KHSFJP80"
      };

      try {
        console.log("Initializing Firebase...");
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        console.log("Firebase initialized successfully");

        window.addFlower = async function(flowerData) {
          try {
            const docRef = await addDoc(collection(db, "flowers"), flowerData);
            console.log("Flower added to Firestore with ID: ", docRef.id);
            return docRef.id;
          } catch (error) {
            console.error("Error adding flower:", error);
            return null;
          }
        };

      } catch (error) {
        console.error("Error initializing Firebase:", error);
      }

      const feedbackMessage = document.getElementById('feedback-message');

      // Function to get URL parameters
      function getUrlParams() {
          const params = {};
          const queryString = window.location.search.substring(1);
          const regex = /([^&=]+)=([^&]*)/g;
          let m;
          while (m = regex.exec(queryString)) {
              params[decodeURIComponent(m[1])] = decodeURIComponent(m[2]);
          }
          return params;
      }

      const params = getUrlParams();
      console.log("URL Parameters:", params);

      let flowerType = params['type'];
      let flowerColor = params['color'] || '#ffffff';
      let flowerQRId = params['qrId'];

      if (flowerType === undefined && flowerQRId !== undefined) {
          flowerType = flowerQRId;
      }

      if (flowerType === undefined) {
          feedbackMessage.textContent = 'Error: Flower type not specified in QR code.';
          console.error('Flower type not specified in URL parameters.');
      } else {
          feedbackMessage.textContent = `Tap to place ${flowerType === '0' ? 'Milkweed' : flowerType === '1' ? 'Nymphaea' : 'Unknown Plant'}`;

          const scene = document.querySelector('a-scene');
          scene.addEventListener('arjs-original-camera-init', function() {
              console.log('AR.js camera initialized.');
              feedbackMessage.textContent = 'Move your device to find a surface.';
          });

          scene.addEventListener('arjs-video-initialized', function() {
               console.log('AR.js video initialized.');
          });

          scene.addEventListener('click', function(event) {
              if (!event.detail.intersection) {
                  feedbackMessage.textContent = 'Tap on a detected surface.';
                  return;
              }

              const hit = event.detail.intersection;
              console.log('Surface tapped at:', hit.point);

              const flowerEntity = document.createElement('a-box');
              flowerEntity.setAttribute('position', `${hit.point.x} ${hit.point.y} ${hit.point.z}`);
              flowerEntity.setAttribute('color', flowerColor);
              flowerEntity.setAttribute('scale', '0.2 0.2 0.2');

              scene.appendChild(flowerEntity);

              feedbackMessage.textContent = 'Flower placed! Saving...';

              const flowerData = {
                  type: flowerType,
                  color: flowerColor,
                  location: { x: hit.point.x, y: hit.point.y, z: hit.point.z },
                  timestamp: new Date().toISOString(),
                  propagationType: 'ar'
              };

              window.addFlower(flowerData).then(id => {
                  if (id) {
                      feedbackMessage.textContent = 'Flower saved to garden!';
                      console.log('Flower data saved:', flowerData);
                      setTimeout(() => {
                          window.location.href = 'index.html';
                      }, 3000);
                  } else {
                      feedbackMessage.textContent = 'Error saving flower.';
                  }
              });
          });

          scene.addEventListener('arjs-anchor-found', function(event){
              feedbackMessage.textContent = 'Surface found! Tap to place flower.';
          });

          scene.addEventListener('arjs-anchor-lost', function(event){
              feedbackMessage.textContent = 'Looking for a surface...';
          });
      }

      let currentMode = 'ar';
      let mapZoom = 1;
      let mapOffset = { x: 0, y: 0 };
      let isDragging = false;
      let lastMousePos = { x: 0, y: 0 };

      window.toggleMode = function() {
          const mapView = document.getElementById('map-view');
          const arScene = document.getElementById('ar-scene');
          const modeSwitch = document.querySelector('.mode-switch');
          
          if (currentMode === 'ar') {
              mapView.style.display = 'block';
              arScene.style.display = 'none';
              modeSwitch.textContent = 'Switch to AR View';
              currentMode = 'map';
              // Call initializeMap only after the image is loaded
              const mapImage = document.getElementById('map-image');
              if (mapImage.complete) { // If image is already loaded (e.g. from cache)
                  initializeMap();
              } else {
                  mapImage.onload = initializeMap;
              }
          } else {
              mapView.style.display = 'none';
              arScene.style.display = 'block';
              modeSwitch.textContent = 'Switch to Map View';
              currentMode = 'ar';
          }
      }

      function initializeMap() {
          const mapContainer = document.getElementById('map-container');
          const mapImage = document.getElementById('map-image');
          
          // Center the image initially based on its loaded dimensions
          mapOffset = {
              x: (mapContainer.offsetWidth - mapImage.offsetWidth) / 2,
              y: (mapContainer.offsetHeight - mapImage.offsetHeight) / 2
          };
          
          mapContainer.addEventListener('mousedown', (e) => {
              isDragging = true;
              lastMousePos = { x: e.clientX, y: e.clientY };
          });

          mapContainer.addEventListener('mousemove', (e) => {
              if (isDragging) {
                  const dx = e.clientX - lastMousePos.x;
                  const dy = e.clientY - lastMousePos.y;
                  mapOffset.x += dx;
                  mapOffset.y += dy;
                  lastMousePos = { x: e.clientX, y: e.clientY };
                  updateMapView();
              }
          });

          mapContainer.addEventListener('mouseup', () => {
              isDragging = false;
          });

          updateMapView();
      }

      window.updateMapView = function() {
          const mapContainer = document.getElementById('map-container');
          mapContainer.style.transform = `translate(${mapOffset.x}px, ${mapOffset.y}px) scale(${mapZoom})`;
      }

      window.zoomIn = function() {
          mapZoom = Math.min(mapZoom * 1.2, 3);
          updateMapView();
      }

      window.zoomOut = function() {
          mapZoom = Math.max(mapZoom / 1.2, 0.5);
          updateMapView();
      }

      window.placeFlowerOnMap = function() {
          const mapContainer = document.getElementById('map-container');
          const mapImage = document.getElementById('map-image');
          const rect = mapContainer.getBoundingClientRect();
          
          // Calculate position relative to the image
          const x = (lastMousePos.x - rect.left - mapOffset.x) / mapZoom;
          const y = (lastMousePos.y - rect.top - mapOffset.y) / mapZoom;
          
          // Convert to percentage of image size for better scaling
          const xPercent = (x / mapImage.width) * 100;
          const yPercent = (y / mapImage.height) * 100;

          const flowerData = {
              type: flowerType,
              color: flowerColor,
              location: { 
                  x: xPercent, 
                  y: yPercent, 
                  z: 0 
              },
              timestamp: new Date().toISOString(),
              propagationType: 'map'
          };

          window.addFlower(flowerData).then(id => {
              if (id) {
                  feedbackMessage.textContent = 'Flower placed on map!';
                  console.log('Flower data saved:', flowerData);
                  setTimeout(() => {
                      window.location.href = 'index.html';
                  }, 3000);
              } else {
                  feedbackMessage.textContent = 'Error saving flower.';
              }
          });
      }

    </script>
  </body>
</html>
